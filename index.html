<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; img-src 'self' blob: data: https:; media-src blob:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f2328">
<title>Reading Inbox</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <button id="back" class="icon" aria-label="Back to list" hidden>&#8592;</button>
  <div id="bar-title">Reading Inbox</div>
  <button id="toc-btn" class="icon" aria-label="Contents" hidden>&#9776;</button>
  <button id="layout-btn" class="icon" aria-label="Layout settings">Aa</button>
  <button id="menu-btn" class="icon" aria-label="Connection settings">&#9881;</button>
</header>
<div id="progress"><div id="progress-fill"></div></div>
<div id="status" role="status" hidden></div>

<main id="view"></main>

<aside id="toc" class="panel" hidden>
  <div class="panel-head"><strong>Contents</strong><button class="icon close" aria-label="Close">&#10005;</button></div>
  <nav id="toc-list"></nav>
</aside>

<aside id="layout" class="panel" hidden>
  <div class="panel-head"><strong>Layout</strong><button class="icon close" aria-label="Close">&#10005;</button></div>
  <label>Text width <output id="o-width"></output><input id="s-width" type="range" min="40" max="165" step="5"></label>
  <label>Font size <output id="o-size"></output><input id="s-size" type="range" min="13" max="30" step="1"></label>
  <label>Line spacing <output id="o-line"></output><input id="s-line" type="range" min="1.2" max="2.2" step="0.05"></label>
  <label>Font
    <select id="s-font"><option value="serif">Serif</option><option value="sans">Sans</option><option value="mono">Monospace</option></select></label>
  <label>Theme
    <select id="s-theme"><option value="auto">Match device</option><option value="light">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select></label>
  <label>Alignment
    <select id="s-align"><option value="center">Centered column</option><option value="left">Left aligned</option></select></label>
  <label class="check"><input id="s-wrap" type="checkbox"> Wrap long code lines</label>
  <button id="s-reset">Reset to defaults</button>
</aside>

<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
